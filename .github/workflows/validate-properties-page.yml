name: Validate Realtor Funnel

on:
  push:
    branches:
      - agent/realtor-conversion-page
  pull_request:
    branches:
      - main
    paths:
      - "app/properties/**"
      - "middleware.ts"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-properties-page.yml"

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
